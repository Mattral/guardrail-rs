[workspace]
members = [
    "crates/guardrail-core",
    "crates/guardrail-classifiers",
    "crates/guardrail-proxy",
    "crates/guardrail-config",
    "crates/guardrail-cli",
    "crates/guardrail-test-suite",
]
resolver = "2"

[workspace.package]
# Also bump the guardrail-* entries in [workspace.dependencies] below.
version     = "0.3.1"
edition     = "2021"
# Keep in sync with the "MSRV (1.88)" job in .github/workflows/ci.yml and
# the MSRV badge in README.md — all three should always agree.
rust-version = "1.88"
authors     = ["Mattral <mattralminn@gmail.com>"]
license     = "Apache-2.0 OR MIT"
repository  = "https://github.com/Mattral/guardrail-rs"
homepage    = "https://github.com/Mattral/guardrail-rs"
readme      = "README.md"
description = "LLM security proxy in Rust: detect prompt injection, redact PII, and block toxic content. OpenAI-compatible drop-in."
categories  = ["web-programming", "network-programming", "science"]
keywords    = ["llm", "security", "proxy", "guardrail", "prompt-injection"]

[workspace.dependencies]
# Internal crates. Members use `guardrail-x = { workspace = true }`; the
# version is needed for publishing and must equal [workspace.package].version.
guardrail-core        = { path = "crates/guardrail-core", version = "0.3.1" }
guardrail-classifiers = { path = "crates/guardrail-classifiers", version = "0.3.1" }
guardrail-config      = { path = "crates/guardrail-config", version = "0.3.1" }
guardrail-proxy       = { path = "crates/guardrail-proxy", version = "0.3.1" }
# Async runtime. No features here: each crate turns on what it uses, so
# embedding a library crate doesn't pull in all of tokio.
tokio          = { version = "1", default-features = false }
# HTTP
hyper          = { version = "1", features = ["http1", "http2", "server"] }
hyper-util     = { version = "0.1", features = ["tokio", "server", "server-auto"] }
http-body-util = { version = "0.1" }
# The compression features make reqwest decode upstream bodies itself, so
# response redaction always sees plain text (it drops `content-encoding` and
# `content-length` from a response it has decoded).
reqwest        = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "brotli", "deflate", "zstd"] }
# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
# Config
toml           = "0.8"
# Error handling
thiserror      = "2"
anyhow         = "1"
# Observability
tracing              = "0.1"
tracing-subscriber   = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender     = "0.2"
tracing-opentelemetry = "0.34"
opentelemetry        = { version = "0.33", features = ["trace"] }
opentelemetry_sdk    = { version = "0.33", features = ["trace"] }
opentelemetry-otlp   = { version = "0.33", features = ["grpc-tonic", "trace"] }
# Regex
regex = "1"
# Metrics
# default-features = false drops the `protobuf` dependency (protobuf 2.28.0
# carries RUSTSEC-2024-0437, an uncontrolled-recursion crash). We only ever
# use `prometheus::TextEncoder` (see guardrail-proxy/src/metrics.rs), which
# doesn't need the protobuf encoder at all, so this is a pure dependency-
# footprint/security win with no functional change.
prometheus = { version = "0.13", default-features = false }
# Misc
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"
arc-swap = "1"
clap = { version = "4", features = ["derive", "env"] }
subtle = "2.6"
chrono = { version = "0.4", features = ["alloc"] }
# Test and benchmark only
tempfile   = "3"
wiremock   = "0.6"
tokio-test = "0.4"
criterion  = "0.5"
rstest     = "0.23"
proptest   = "1"
flate2     = "1"

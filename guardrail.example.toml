# guardrail-rs example configuration
#
# Copy this file to `guardrail.toml` and edit `[upstream].url` at minimum.
# Run `guardrail validate --config guardrail.toml` after any change.

# ── Server ─────────────────────────────────────────────────────────────────────
[server]
host = "0.0.0.0"
port = 8080

# Number of Tokio worker threads. 0 = number of logical CPUs.
workers = 0

# Maximum accepted client request body size, in bytes.
max_body_size_bytes = 10485760  # 10 MiB

# Routes forwarded WITHOUT scanning, as "METHOD /path" ("/*" matches
# everything under a path). Scanned routes are /v1/chat/completions,
# /v1/messages, /v1/responses and Azure's
# /openai/deployments/{deployment}/chat/completions; anything else gets 404.
passthrough_paths = ["GET /v1/models", "GET /v1/models/*"]

# ── Upstream LLM provider ─────────────────────────────────────────────────────
[upstream]
# Point this at the real provider. The request format is picked by path (see
# passthrough_paths above for the route list).
url = "https://api.openai.com"

# Per-request timeout to the upstream, in seconds.
timeout_secs = 120

# TCP connection timeout, in seconds.
connect_timeout = 10

# ── Caller authentication (optional) ──────────────────────────────────────────
# When enabled, callers must present a matching key in the X-Guardrail-Key
# header. This is separate from the upstream Authorization header, which is
# always forwarded opaquely and never inspected by guardrail-rs.
[auth]
require_key = false
# keys = ["grk-your-generated-key-here"]

# ── Pipeline ordering ──────────────────────────────────────────────────────────
[pipeline]
# Ordered list of request-side stages. Removing an entry disables that stage
# regardless of its own [stages.*] enabled flag.
request_stages = ["regex_injection", "onnx_injection", "pii_redactor", "toxicity", "policy"]

# Ordered list of response-side stages.
response_stages = ["output_pii_redactor"]

# What to do when a stage errors instead of returning a decision (e.g. ONNX
# inference fails): "allow" (fail-open, default) skips that stage's check;
# "block" rejects the request with 403 / stage_error. Stages without their
# own on_error use this value.
on_error = "allow"

# Longest any stage may take on one request, in ms (0 = no limit). A timeout
# is handled like a stage error (on_error): with fail-open ONNX stages, slow
# (long) requests would skip them, so set on_error = "block" there too.
stage_timeout_ms = 0

# ── Stage 1: regex-based prompt injection detection ───────────────────────────
[stages.regex_injection]
enabled = true

# Path to a custom rule file (one regex per line, # for comments).
# Empty string = use the bundled rule set.
rules_file = ""

# Additional patterns appended to whichever rule set is active.
extra_rules = []

# What to do on a match: "block" (default) or "log_only" (dry-run mode — logs
# but allows the request). "redact" is accepted but behaves like "block".
action = "block"

# ── Stage 2: ONNX semantic injection classifier (optional) ────────────────────
# Requires building with --features onnx and providing model files.
# See docs/onnx-models.md.
[stages.onnx_injection]
enabled = false
model_path = ""
tokenizer_path = ""
threshold = 0.85
# "block" (default) or "log_only" (log the score, allow the request).
action = "block"
# Optional: overrides [pipeline].on_error for this stage only.
# on_error = "block"
# Most 512-token windows scored per request (16 = 6,272 tokens), and what to
# do with longer input: "block" (default, 403 input_too_long_for_classifier)
# or "allow" (forward it without this check).
max_windows = 16
on_oversize = "block"

# ── Stage 3: PII detection and redaction ──────────────────────────────────────
# Detects and replaces PII before it reaches the upstream LLM or the
# toxicity classifier. Default action is "redact" (sanitize and continue).
[stages.pii_redactor]
enabled = true

# Entity types to detect. Valid values:
#   "email", "phone", "credit_card", "ssn", "ip_address", "api_key", "aws_key"
entities = ["email", "phone", "credit_card", "ssn", "ip_address", "api_key", "aws_key"]

# "redact" (default: replace and forward), "block" (reject with 403
# pii_detected), or "log_only" (log the entity types, forward unchanged).
action = "redact"

# Apply Luhn checksum validation to candidate credit-card numbers before
# redacting, to reduce false positives on arbitrary 16-digit numbers.
validate_luhn = true

# Whether to also scan LLM *responses* for PII before returning them to the
# caller. Complete responses are redacted as a whole; streamed responses
# (stream: true) are redacted incrementally and still stream. Compressed
# upstream bodies are decoded first; a response in an encoding the proxy
# can't decode is refused with 502 response_unredactable.
redact_responses = false

# With redact_responses = true: "redact" (default) streams and redacts as
# tokens flow; "reject" refuses stream: true requests with 400.
streaming_responses = "redact"

# Custom replacement tokens (all optional; shown values are the defaults).
[stages.pii_redactor.replacements]
email = "[EMAIL]"
phone = "[PHONE]"
credit_card = "[CARD]"
ssn = "[SSN]"
ip_address = "[IP_ADDRESS]"
api_key = "[API_KEY]"
aws_key = "[AWS_KEY]"

# ── Stage 4: ONNX toxicity classifier (optional) ───────────────────────────────
[stages.toxicity]
enabled = false
model_path = ""
tokenizer_path = ""
threshold = 0.90
action = "block"
# Message roles to score: any of "system", "user", "assistant", "tool".
scan_roles = ["user"]
# Optional: overrides [pipeline].on_error for this stage only.
# on_error = "block"
max_windows = 16
on_oversize = "block"

# ── ONNX runtime ──────────────────────────────────────────────────────────────
# Each enabled ONNX stage gets its own pool of sessions; each session scores
# one request at a time and holds its own copy of the model (~0.85 GB for the
# DeBERTa injection model). 0 = one per core / intra_threads, at most 4.
[onnx]
sessions = 0
intra_threads = 1

# ── Stage 5: user-defined policy rules ─────────────────────────────────────────
# Evaluated last, in order. The first enabled rule whose `when` condition
# matches determines the outcome. See docs/policy-rules.md for the full
# condition reference and worked examples.
[[policy.rules]]
name = "block-competitor-mentions"
enabled = false

[policy.rules.when]
content_contains = ["competitor-x", "competitor-y"]

[policy.rules.then]
action = "block"
message = "Mentions of named competitors are not permitted in this deployment."


# ── Observability ─────────────────────────────────────────────────────────────
[observability]
# Log level: "trace", "debug", "info", "warn", "error".
log_level = "info"

# Log output format: "pretty" (human-readable, default) or "json".
# Use "json" in production for log aggregation (Datadog, Splunk, Loki, etc.).
log_format = "pretty"

# Reserved for a future release that serves /metrics on a separate port.
# /metrics is currently served on server.host:server.port alongside the
# proxy endpoints regardless of this setting.
metrics_port = 9090

# OpenTelemetry OTLP gRPC endpoint for distributed tracing.
# Leave empty (default) to disable OTLP export.
# Example: "http://localhost:4317" for a local Jaeger/Tempo collector.
otlp_endpoint = ""

# ── Structured NDJSON audit log ────────────────────────────────────────────────
# When enabled, every pipeline decision (allow, redact, block) is written as a
# newline-delimited JSON record to `path`, independently of the general
# application log. Suitable for ingestion by Filebeat, Vector, etc.
#
# Rotation: when the file would exceed max_size_mb, it is renamed to
# <path>.<unix_timestamp> and a fresh file is opened at `path`.
[observability.audit_log]
enabled = false
path = "./guardrail-audit.ndjson"
max_size_mb = 100

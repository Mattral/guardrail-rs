name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Format ─────────────────────────────────────────────────────────────────
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ── Lint ───────────────────────────────────────────────────────────────────
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo clippy --workspace --all-targets -- -D warnings

  # ── Tests (nextest) ────────────────────────────────────────────────────────
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary: stable on Linux
          - os: ubuntu-latest
            toolchain: stable
          # Cross-platform: stable on macOS (arm64 runner)
          - os: macos-latest
            toolchain: stable
          # Cross-platform: stable on Windows
          - os: windows-latest
            toolchain: stable
          # Beta Rust: catch upcoming breakage early
          - os: ubuntu-latest
            toolchain: beta
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain }}
      - uses: taiki-e/install-action@nextest
      - name: cargo nextest run (CI profile)
        run: cargo nextest run --workspace --profile ci
      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}-${{ matrix.toolchain }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
      - name: cargo test --doc
        run: cargo test --workspace --doc

  # ── No-default-features build ──────────────────────────────────────────────
  no-default-features:
    name: build (no-default-features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p guardrail-core --no-default-features
      - run: cargo check -p guardrail-classifiers --no-default-features

  # ── ONNX feature: lint + real inference tests ──────────────────────────────
  # Runs ONNX Runtime against the tiny fixture models committed under
  # crates/guardrail-classifiers/tests/fixtures/onnx (no download needed).
  # Windows is included because the feature once failed to link there
  # (static vs dynamic MSVC runtime between tokenizers and ort).
  test-onnx:
    name: test (onnx feature, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: onnx-${{ matrix.os }}
      - uses: taiki-e/install-action@nextest
      - name: cargo clippy --features onnx
        run: cargo clippy --workspace --all-targets --features guardrail-cli/onnx -- -D warnings
      - name: cargo nextest run --features onnx
        run: cargo nextest run --workspace --features guardrail-cli/onnx --profile ci

  # ── MSRV ───────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins `stable`, and it beats the toolchain the
      # action installs. Without this override the job silently built with
      # stable and never tested the declared MSRV.
      - name: cargo check on the MSRV toolchain
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          rustc --version
          rustc --version | grep -q '^rustc 1\.88\.'
          cargo check --workspace --all-targets

  # ── Code coverage ──────────────────────────────────────────────────────────
  coverage:
    name: coverage (tarpaulin → Codecov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage (XML + stdout summary)
        run: |
          mkdir -p coverage/
          set -o pipefail
          cargo tarpaulin \
            --workspace \
            --exclude guardrail-test-suite \
            --out Xml Stdout \
            --output-dir coverage/ \
            --timeout 300 \
            --ignore-tests \
            2>&1 | tee coverage/tarpaulin-stdout.txt || true
      - name: Enforce ≥ 80% line coverage
        run: |
          # Robustly parse the tarpaulin stdout and enforce threshold.
          python3 - <<'PY'
          import re, sys
          try:
              txt = open('coverage/tarpaulin-stdout.txt', 'r', encoding='utf-8').read()
          except FileNotFoundError:
              print('ERROR: coverage/tarpaulin-stdout.txt not found. cargo-tarpaulin may have failed to run.')
              sys.exit(1)
      
          m = re.search(r'(\d+(?:\.\d+)?)\s*% coverage', txt)
          if not m:
              print('ERROR: Could not find coverage percentage in tarpaulin output. Full output below:\n')
              print(txt)
              sys.exit(1)
      
          pct = float(m.group(1))
          print(f'Measured line coverage: {pct}%')
          if pct < 80.0:
              print(f'Coverage {pct:.1f}% is below the 80% threshold.')
              sys.exit(1)
      
          print(f'Coverage {pct:.1f}% meets the 80% threshold. ✓')
          PY
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── License & advisory checks ──────────────────────────────────────────────
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # ── Internal dependency versions ───────────────────────────────────────────
  # Internal crates are declared once, in the root [workspace.dependencies],
  # with a version (needed for publishing). It must equal
  # [workspace.package].version, and no crate may declare one itself.
  version-pin-check:
    name: internal dependency versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal dependency versions match the workspace version
        run: |
          WORKSPACE_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Workspace version: ${WORKSPACE_VERSION}"
          FAILED=0
          while IFS= read -r line; do
            PIN=$(echo "$line" | grep -oP 'version\s*=\s*"\K[^"]+')
            if [ "$PIN" != "$WORKSPACE_VERSION" ]; then
              echo "MISMATCH: $line"
              FAILED=1
            fi
          done < <(grep -E '^guardrail-[a-z]+ +=.*path = "crates/' Cargo.toml)
          if grep -n 'path = "\.\./guardrail-' crates/*/Cargo.toml; then
            echo "Use 'guardrail-x = { workspace = true }' in member crates."
            FAILED=1
          fi
          exit $FAILED

  # ── Security audit ─────────────────────────────────────────────────────────
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # ── Documentation build ────────────────────────────────────────────────────
  docs:
    name: docs (rustdoc + mdbook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (no deps)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Install mdBook
        run: cargo install mdbook --locked
      - name: mdbook build
        run: mdbook build

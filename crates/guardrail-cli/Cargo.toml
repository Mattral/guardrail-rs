[package]
name        = "guardrail-cli"
description = "Command-line interface for guardrail-rs"
version.workspace     = true
edition.workspace     = true
rust-version.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
categories.workspace  = true
keywords.workspace  = true
readme             = "../../README.md"

[[bin]]
name = "guardrail"
path = "src/main.rs"

[features]
default = []
onnx = ["guardrail-proxy/onnx", "guardrail-config/onnx", "guardrail-classifiers/onnx"]

[dependencies]
guardrail-core        = { workspace = true }
guardrail-config      = { workspace = true }
guardrail-classifiers = { workspace = true }
guardrail-proxy       = { workspace = true }

clap   = { workspace = true }
tokio  = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
anyhow = { workspace = true }

tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
async-trait = { workspace = true }

serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

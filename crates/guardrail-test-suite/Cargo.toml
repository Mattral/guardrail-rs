[package]
name        = "guardrail-test-suite"
description = "End-to-end integration tests for guardrail-rs (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish     = false

[dependencies]

[dev-dependencies]
guardrail-core        = { workspace = true }
guardrail-config      = { workspace = true }
guardrail-classifiers = { workspace = true }
guardrail-proxy       = { workspace = true }

tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
reqwest    = { workspace = true }
serde_json = { workspace = true }
bytes      = { workspace = true }
wiremock   = { workspace = true }
# Gzip test fixtures. Do not enable reqwest's `gzip` feature here instead:
# feature unification would turn it on for the proxy too and hide bugs in it.
flate2     = { workspace = true }
tempfile   = { workspace = true }
criterion  = { workspace = true, features = ["html_reports"] }

[[bench]]
name = "pipeline"
harness = false

[package]
name        = "guardrail-classifiers"
description = "Classifier implementations for guardrail-rs: regex, ONNX, and PII redaction"
version.workspace     = true
edition.workspace     = true
rust-version.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
categories.workspace  = true
keywords.workspace  = true
readme             = "../../README.md"

[features]
default = []
# Enable ONNX-backed classifiers (requires ort + tokenizers)
onnx = ["dep:ort", "dep:tokenizers"]
# Enable ONNX-based NER PII detection
onnx-pii = ["onnx"]
# Enable CUDA GPU acceleration (implies onnx)
onnx-cuda = ["onnx", "ort/cuda"]

[dependencies]
guardrail-core = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
regex          = { workspace = true }
async-trait    = { workspace = true }
tracing        = { workspace = true }
tokio          = { workspace = true, features = ["rt", "sync"] }

# Optional ONNX deps (behind feature flag)
ort         = { version = "2.0.0-rc.12", optional = true }
# Default features are off: `esaxx_fast` builds C++ with the static MSVC
# runtime, which can't link alongside ONNX Runtime on Windows (LNK2038
# RuntimeLibrary mismatch), and `progressbar` is only for training. We only
# load tokenizer.json files, which needs neither.
tokenizers  = { version = "0.22", optional = true, default-features = false, features = ["onig"] }

[dev-dependencies]
tokio      = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
rstest     = { workspace = true }
proptest   = { workspace = true }
tokio-test = { workspace = true }
criterion  = { workspace = true, features = ["html_reports", "async_tokio"] }

[[bench]]
name = "classifier_benchmarks"
harness = false

# Throughput and latency of an ONNX stage under concurrent requests.
# GUARDRAIL_BENCH_MODEL_DIR=<dir with model.onnx and tokenizer.json> \
#   cargo bench -p guardrail-classifiers --features onnx --bench onnx_concurrency
[[bench]]
name = "onnx_concurrency"
harness = false
required-features = ["onnx"]

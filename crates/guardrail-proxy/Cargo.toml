[package]
name        = "guardrail-proxy"
description = "HTTP reverse-proxy server for guardrail-rs"
version.workspace     = true
edition.workspace     = true
rust-version.workspace     = true
authors.workspace     = true
license.workspace     = true
repository.workspace  = true
homepage.workspace    = true
categories.workspace  = true
keywords.workspace  = true
readme             = "../../README.md"

[features]
default = []
onnx = ["guardrail-config/onnx", "guardrail-classifiers/onnx"]

[dependencies]
guardrail-core        = { workspace = true, features = ["reqwest-errors"] }
guardrail-config      = { workspace = true }
guardrail-classifiers = { workspace = true }

tokio          = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
hyper          = { workspace = true }
hyper-util     = { workspace = true }
http-body-util = { workspace = true }
reqwest        = { workspace = true }
bytes          = { workspace = true }
futures        = { workspace = true }

serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }

tracing             = { workspace = true }
tracing-subscriber  = { workspace = true }
tracing-appender    = { workspace = true }
tracing-opentelemetry = { workspace = true }
opentelemetry        = { workspace = true }
opentelemetry_sdk    = { workspace = true }
opentelemetry-otlp   = { workspace = true }
prometheus          = { workspace = true }
uuid                = { workspace = true }
# Constant-time comparison of caller API keys (auth.rs).
subtle              = { workspace = true }
chrono              = { workspace = true }

[dev-dependencies]
tokio        = { workspace = true, features = ["rt-multi-thread"] }
tokio-stream = { workspace = true }
wiremock     = { workspace = true }
tempfile     = { workspace = true }
tokio-test   = { workspace = true }
# In-memory span exporter for the tracing tests.
opentelemetry_sdk = { workspace = true, features = ["testing"] }
